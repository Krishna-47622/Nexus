# Render Blueprint specification for Nexus Campus Utility Platform
# Deploy directly by linking your GitHub repository to Render (https://render.com)
services:
  # 1. Spring Boot Backend Web Service
  - type: web
    name: nexus-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /api/v1/auth/health
    envVars:
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: SPRING_PROFILES_ACTIVE
        value: prod

  # 2. Vite React Frontend Static Site
  - type: web
    name: nexus-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: nexus-backend
          property: host
