# Render Blueprint specification for Nexus Campus Utility Platform
# Deploy directly by linking your GitHub repository to Render (https://render.com)
services:
  # 1. Spring Boot Backend Web Service
  - type: web
    name: nexus-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /api/v1/auth/health
    envVars:
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require
      - key: SPRING_DATASOURCE_USERNAME
        value: postgres.qcsdqhzfkpbubtjlwoen
      - key: SPRING_DATASOURCE_PASSWORD
        value: 8fH6MCdzOLKOlXKx

  # 2. Vite React Frontend Static Site
  - type: web
    name: nexus-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://nexus-backend-p63s.onrender.com
