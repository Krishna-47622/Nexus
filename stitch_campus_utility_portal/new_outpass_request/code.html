<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Student Outpass - New Request</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        input[type="time"]::-webkit-calendar-picker-indicator {
            filter: invert(0.4) sepia(1) saturate(3) hue-rotate(180deg); /* Trying to match theme roughly */
        }
    </style>

            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed-variant": "#004395",
                        "surface-tint": "#455f87",
                        "inverse-surface": "#213145",
                        "on-tertiary-fixed": "#291800",
                        "outline": "#74777f",
                        "surface-container-high": "#dce9ff",
                        "inverse-on-surface": "#eaf1ff",
                        "surface-variant": "#d3e4fe",
                        "surface-container-low": "#eff4ff",
                        "on-secondary": "#ffffff",
                        "border-light": "rgba(255, 255, 255, 0.3)",
                        "surface-glass": "rgba(255, 255, 255, 0.7)",
                        "outline-variant": "#c4c6cf",
                        "on-tertiary-container": "#c69b5f",
                        "surface-dim": "#cbdbf5",
                        "on-tertiary": "#ffffff",
                        "on-background": "#0b1c30",
                        "primary": "#022448",
                        "tertiary": "#341f00",
                        "secondary-container": "#2170e4",
                        "success": "#10B981",
                        "surface": "#f8f9ff",
                        "primary-fixed": "#d5e3ff",
                        "surface-container": "#e5eeff",
                        "inverse-primary": "#adc8f5",
                        "primary-container": "#1e3a5f",
                        "error": "#DC2626",
                        "on-secondary-fixed": "#001a42",
                        "on-secondary-container": "#fefcff",
                        "secondary-fixed": "#d8e2ff",
                        "surface-bright": "#f8f9ff",
                        "error-container": "#ffdad6",
                        "on-error": "#ffffff",
                        "on-error-container": "#93000a",
                        "on-primary-fixed": "#001c3b",
                        "on-primary-container": "#8aa4cf",
                        "on-primary-fixed-variant": "#2d486d",
                        "tertiary-container": "#503300",
                        "on-primary": "#ffffff",
                        "surface-container-highest": "#d3e4fe",
                        "background": "#f8f9ff",
                        "secondary-fixed-dim": "#adc6ff",
                        "surface-container-lowest": "#ffffff",
                        "border-dark": "rgba(30, 58, 95, 0.1)",
                        "on-tertiary-fixed-variant": "#60410c",
                        "warning": "#F59E0B",
                        "tertiary-fixed": "#ffddb2",
                        "primary-fixed-dim": "#adc8f5",
                        "secondary": "#0058be",
                        "on-surface": "#0b1c30",
                        "on-surface-variant": "#43474e",
                        "tertiary-fixed-dim": "#edbf7f"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "margin-desktop": "32px",
                        "gutter": "16px",
                        "unit": "4px",
                        "container-max": "1280px",
                        "margin-mobile": "16px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "display-lg": ["Inter"],
                        "caption": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-lg": ["Inter"]
                    },
                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "caption": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-surface text-on-surface font-body-md antialiased min-h-screen pb-24 md:pb-8 flex flex-col items-center">
<!-- TopAppBar -->
<header class="bg-surface-glass dark:bg-surface-container-high/70 w-full sticky top-0 backdrop-blur-[10px] border-b border-border-dark dark:border-border-light flex justify-between items-center px-margin-mobile md:px-margin-desktop py-unit h-16 z-40 max-w-container-max mx-auto">
<div class="flex items-center gap-gutter">
<div class="w-10 h-10 rounded-full bg-surface-variant overflow-hidden border border-border-dark flex items-center justify-center">
<span class="material-symbols-outlined text-primary" data-icon="account_circle">account_circle</span>
</div>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-inverse-primary tracking-tight">Nexus</h1>
</div>
<button class="w-10 h-10 rounded-DEFAULT hover:bg-primary-fixed/20 transition-colors active:scale-95 duration-150 flex items-center justify-center text-primary dark:text-inverse-primary">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
</header>
<!-- Main Content -->
<main class="w-full max-w-container-max px-margin-mobile md:px-margin-desktop py-gutter flex-1 flex flex-col gap-6 items-center">
<!-- High Density Form Card -->
<div class="w-full max-w-2xl bg-surface-glass backdrop-blur-[10px] border border-border-dark rounded-DEFAULT p-6 flex flex-col gap-6 shadow-none">
<div class="flex flex-col gap-2 border-b border-border-dark pb-4">
<h2 class="font-headline-md text-headline-md-mobile md:text-headline-md text-primary">New Outpass</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Fill in the details below to request a temporary exit from campus.</p>
</div>
<form class="flex flex-col gap-6">
<!-- 1. Type Toggle -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface">Outpass Type</label>
<div class="flex p-1 bg-surface-container-lowest border border-border-dark rounded-DEFAULT">
<button class="flex-1 py-2 text-center rounded-DEFAULT bg-primary-container text-on-primary-container font-label-md text-label-md transition-colors shadow-sm" type="button">
                            Local
                        </button>
<button class="flex-1 py-2 text-center rounded-DEFAULT text-on-surface-variant hover:bg-surface-variant font-label-md text-label-md transition-colors" type="button">
                            Non-Local
                        </button>
</div>
</div>
<!-- 2. Time Pickers (High Density Grid) -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="out-time">Departure Time</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline pointer-events-none" data-icon="schedule">schedule</span>
<input class="w-full pl-10 pr-3 py-2 bg-surface-container-lowest border border-border-dark rounded-DEFAULT font-body-md text-body-md text-on-surface focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-colors" id="out-time" required="" type="datetime-local">
</div>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="return-time">Return Time</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline pointer-events-none" data-icon="update">update</span>
<input class="w-full pl-10 pr-3 py-2 bg-surface-container-lowest border border-border-dark rounded-DEFAULT font-body-md text-body-md text-on-surface focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-colors" id="return-time" required="" type="datetime-local">
</div>
</div>
</div>
<!-- 3. Destination/Purpose field -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="destination">Destination &amp; Purpose</label>
<textarea class="w-full p-3 bg-surface-container-lowest border border-border-dark rounded-DEFAULT font-body-md text-body-md text-on-surface focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-colors resize-none placeholder-outline" id="destination" placeholder="Enter specific location and reason for leaving..." required="" rows="3"></textarea>
</div>
<!-- 4. Primary CTA -->
<div class="pt-4 border-t border-border-dark mt-2">
<button class="w-full py-3 bg-primary-container text-on-primary-container font-label-md text-label-md rounded-DEFAULT hover:bg-primary transition-colors flex items-center justify-center gap-2 active:scale-95 duration-150" type="submit">
<span class="material-symbols-outlined" data-icon="send" data-weight="fill" style="font-variation-settings: 'FILL' 1;">send</span>
                        Submit Request
                    </button>
</div>
</form>
</div>
</main>
<!-- BottomNavBar (Mobile Only) -->
<nav class="md:hidden bg-surface-glass dark:bg-surface-container-high/70 fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-20 px-2 pb-safe backdrop-blur-[10px] border-t border-border-dark dark:border-border-light shadow-none">
<!-- Canteen (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant p-2 hover:bg-primary-fixed/10 active:scale-95 duration-150 rounded-DEFAULT min-w-[64px]" href="#">
<span class="material-symbols-outlined mb-1" data-icon="restaurant">restaurant</span>
<span class="font-label-md text-label-md text-[10px]">Canteen</span>
</a>
<!-- Sports (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant p-2 hover:bg-primary-fixed/10 active:scale-95 duration-150 rounded-DEFAULT min-w-[64px]" href="#">
<span class="material-symbols-outlined mb-1" data-icon="sports_basketball">sports_basketball</span>
<span class="font-label-md text-label-md text-[10px]">Sports</span>
</a>
<!-- Print (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant p-2 hover:bg-primary-fixed/10 active:scale-95 duration-150 rounded-DEFAULT min-w-[64px]" href="#">
<span class="material-symbols-outlined mb-1" data-icon="print">print</span>
<span class="font-label-md text-label-md text-[10px]">Print</span>
</a>
<!-- Leave (Active for Outpass context) -->
<a class="flex flex-col items-center justify-center bg-secondary-container dark:bg-secondary text-on-secondary-container dark:text-on-secondary rounded-DEFAULT p-2 hover:bg-primary-fixed/10 active:scale-95 duration-150 min-w-[64px]" href="#">
<span class="material-symbols-outlined mb-1" data-icon="exit_to_app" data-weight="fill" style="font-variation-settings: 'FILL' 1;">exit_to_app</span>
<span class="font-label-md text-label-md text-[10px]">Leave</span>
</a>
</nav>


</body></html>
