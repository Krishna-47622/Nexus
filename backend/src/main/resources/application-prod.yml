server:
  port: ${PORT:10000}
  servlet:
    context-path: /

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require}
    username: ${SPRING_DATASOURCE_USERNAME:postgres.qcsdqhzfkpbubtjlwoen}
    password: ${SPRING_DATASOURCE_PASSWORD:8fH6MCdzOLKOlXKx}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 30000
      max-lifetime: 60000
      connection-timeout: 30000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        default_schema: public
        jdbc:
          lob:
            non_contextual_creation: true
  h2:
    console:
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET:9a8f7e6d5c4b3a2f1e0d9c8b7a6f5e4d3c2b1a0987654321fedcba9876543210}
